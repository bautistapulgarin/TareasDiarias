    <script>
        // Firebase config
        const firebaseConfig = {
            apiKey: "AIzaSyA-K-rjFQLD4ahPG1z5n9Pe_E4W2WfDD94",
            authDomain: "control-diario-1e2fb.firebaseapp.com",
            projectId: "control-diario-1e2fb",
            storageBucket: "control-diario-1e2fb.firebasestorage.app",
            messagingSenderId: "98274574789",
            appId: "1:98274574789:web:3c0970ef809754b9dc0bac"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const { jsPDF } = window.jspdf;

        document.getElementById('status').textContent = '✓ Conectado';
        document.getElementById('status').classList.add('connected');

        // DOM Elements
        const btnNuevaTarea = document.getElementById('btnNuevaTarea');
        const modalNuevaTarea = document.getElementById('modalNuevaTarea');
        const closeModalTarea = document.getElementById('closeModalTarea');
        const btnGuardarTarea = document.getElementById('guardarTarea');
        const inputProyecto = document.getElementById('proyecto');
        const inputTarea = document.getElementById('tarea');
        const inputHoraInicial = document.getElementById('horaInicial');
        const inputHoraCierre = document.getElementById('horaCierre');
        const inputPrioridad = document.getElementById('prioridad');
        const prioridadDisplay = document.getElementById('prioridadDisplay');
        const mensajeTarea = document.getElementById('mensajeTarea');
        const listaTareas = document.getElementById('listaTareas');
        const modalTiempo = document.getElementById('modalTiempo');
        const closeModalTiempo = document.getElementById('closeModalTiempo');
        const btnConfirmarHora = document.getElementById('btnConfirmarHora');
        const horaRegistro = document.getElementById('horaRegistro');

        // Notas
        const btnToggleTareas = document.getElementById('btnToggleTareas');
        const tareasNotasContainer = document.getElementById('tareasNotasContainer');
        const tareasLista = document.getElementById('tareasLista');
        const tareasInputContainer = document.getElementById('tareasInputContainer');
        const reunionInput = document.getElementById('reunionInput');
        const temaInput = document.getElementById('temaInput');
        const subpuntosContainer = document.getElementById('subpuntosContainer');
        const btnAddSubpunto = document.getElementById('btnAddSubpunto');
        const btnGuardarNotas = document.getElementById('btnGuardarNotas');
        const mensajeNotas = document.getElementById('mensajeNotas');

        let tareaActual = null;
        let tareasReunion = [];
        let tareaInput = null;
        let btnAddTarea = null;

        // EVENT LISTENERS
        btnNuevaTarea.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            inputProyecto.value = inputTarea.value = inputHoraInicial.value = inputHoraCierre.value = '';
            inputPrioridad.value = '5';
            prioridadDisplay.textContent = '5/10';
            modalNuevaTarea.classList.add('show');
        });

        closeModalTarea.addEventListener('click', () => modalNuevaTarea.classList.remove('show'));
        closeModalTiempo.addEventListener('click', () => modalTiempo.classList.remove('show'));

        inputPrioridad.addEventListener('change', () => {
            const val = parseInt(inputPrioridad.value) || 5;
            prioridadDisplay.textContent = `${val}/10`;
        });

        btnGuardarTarea.addEventListener('click', async () => {
            const proyecto = inputProyecto.value.trim();
            const tarea = inputTarea.value.trim();
            const horaInit = inputHoraInicial.value;
            const horaCierr = inputHoraCierre.value;
            const prioridad = inputPrioridad.value;

            if (!proyecto || !tarea || !horaInit || !horaCierr) {
                mostrarMensaje(mensajeTarea, 'Completa todos los campos', 'error');
                return;
            }

            btnGuardarTarea.disabled = true;
            btnGuardarTarea.textContent = 'GUARDANDO...';

            try {
                const hoy = new Date().toISOString().split('T')[0];
                await db.collection('tareas').add({
                    proyecto, tarea, horaInicial: horaInit, horaCierre: horaCierr,
                    prioridad: parseInt(prioridad), fecha: hoy,
                    horaRealInicio: null, horaRealCierre: null, variacion: null, estado: 'pendiente'
                });
                mostrarMensaje(mensajeTarea, '✓ Guardado', 'success');
                modalNuevaTarea.classList.remove('show');
                cargarTareas();
            } catch (error) {
                mostrarMensaje(mensajeTarea, 'Error: ' + error.message, 'error');
            } finally {
                btnGuardarTarea.disabled = false;
                btnGuardarTarea.textContent = 'GUARDAR';
            }
        });

        async function cargarTareas() {
            const hoy = new Date().toISOString().split('T')[0];
            const snapshot = await db.collection('tareas')
                .where('fecha', '==', hoy)
                .get();
            
            let tareas = [];
            snapshot.forEach(doc => tareas.push({ id: doc.id, data: doc.data() }));
            tareas.sort((a, b) => {
                if (a.data.estado === 'completada' && b.data.estado !== 'completada') return 1;
                if (a.data.estado !== 'completada' && b.data.estado === 'completada') return -1;
                if (a.data.estado !== 'completada' && b.data.estado !== 'completada') {
                    return b.data.prioridad - a.data.prioridad;
                }
                return 0;
            });

            listaTareas.innerHTML = '';
            if (tareas.length === 0) {
                listaTareas.innerHTML = '<p style="color: #999;">Sin tareas</p>';
                return;
            }

            tareas.forEach(tarea => {
                const card = document.createElement('div');
                card.className = 'tarea-card';
                const { proyecto, tarea: tareanombre, horaInicial, horaCierre, prioridad, estado, horaRealInicio, horaRealCierre } = tarea.data;
                
                card.innerHTML = `
                    <div class="tarea-header">
                        <div>
                            <div class="tarea-title">${tareanombre}</div>
                            <div class="tarea-proyecto">${proyecto}</div>
                        </div>
                    </div>
                    <div class="tarea-info">
                        ${horaInicial} - ${horaCierre} | Prioridad: ${prioridad}/10
                    </div>
                    <div style="display: flex; gap: 8px;">
                        ${estado === 'pendiente' ? `
                            <button class="btn-small iniciar" onclick="iniciarTarea('${tarea.id}')">INICIAR</button>
                            <button class="btn-small terminar" onclick="eliminarTarea('${tarea.id}')">ELIMINAR</button>
                        ` : estado === 'en_progreso' ? `
                            <button class="btn-small terminar" onclick="terminarTarea('${tarea.id}')">TERMINAR</button>
                        ` : `
                            <button class="tarea-check" disabled>✓ COMPLETADA</button>
                        `}
                    </div>
                `;
                listaTareas.appendChild(card);
            });
        }

        window.iniciarTarea = async function(id) {
            const ahora = new Date().toLocaleTimeString('es-CO').slice(0, 5);
            await db.collection('tareas').doc(id).update({
                estado: 'en_progreso',
                horaRealInicio: ahora
            });
            cargarTareas();
        };

        window.terminarTarea = async function(id) {
            const ahora = new Date().toLocaleTimeString('es-CO').slice(0, 5);
            await db.collection('tareas').doc(id).update({
                estado: 'completada',
                horaRealCierre: ahora
            });
            cargarTareas();
        };

        window.eliminarTarea = async function(id) {
            if (confirm('¿Eliminar tarea?')) {
                await db.collection('tareas').doc(id).delete();
                cargarTareas();
            }
        };

        // Notas
        btnToggleTareas.addEventListener('click', () => {
            if (tareasNotasContainer.style.display === 'none') {
                tareasNotasContainer.style.display = 'block';
                btnToggleTareas.textContent = '- OCULTAR TAREAS';
                if (!tareaInput) {
                    crearInputTarea();
                }
            } else {
                tareasNotasContainer.style.display = 'none';
                btnToggleTareas.textContent = '+ AGREGAR TAREAS';
            }
        });

        function crearInputTarea() {
            tareasInputContainer.innerHTML = `
                <input type="text" id="tareaInput" placeholder="Nueva tarea" style="width: 100%; padding: 10px 12px; border: 1px solid #d0d0cc; background: #fafaf8; font-family: 'Georgia', serif; font-size: 13px; color: #2a2a2a; margin-top: 10px;">
                <button id="btnAddTarea" style="width: 100%; padding: 10px; background: #5a7a8b; color: #fafaf8; border: none; font-family: 'Georgia', serif; font-size: 11px; letter-spacing: 0.5px; text-transform: uppercase; cursor: pointer; margin-top: 8px; border-radius: 20px;">+ AGREGAR TAREA</button>
            `;
            
            tareaInput = document.getElementById('tareaInput');
            btnAddTarea = document.getElementById('btnAddTarea');
            
            btnAddTarea.addEventListener('click', () => {
                const tarea = tareaInput.value.trim();
                if (tarea) {
                    tareasReunion.push(tarea);
                    tareaInput.value = '';
                    renderizarTareas();
                }
            });
            
            tareaInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    const tarea = tareaInput.value.trim();
                    if (tarea) {
                        tareasReunion.push(tarea);
                        tareaInput.value = '';
                        renderizarTareas();
                    }
                }
            });
        }

        btnAddSubpunto.addEventListener('click', () => {
            const item = document.createElement('div');
            item.className = 'subpunto-item';
            item.innerHTML = `
                <input type="text" class="subpunto-input" placeholder="Subpunto">
                <textarea class="subpunto-notas" placeholder="Notas asociadas..."></textarea>
            `;
            subpuntosContainer.appendChild(item);
        });

        function renderizarTareas() {
            tareasLista.innerHTML = '';
            tareasReunion.forEach((tarea, index) => {
                const item = document.createElement('div');
                item.className = 'tarea-item';
                item.innerHTML = `<span>${index + 1}. ${tarea}</span><button class="btn-eliminar-tarea">✕</button>`;
                item.querySelector('.btn-eliminar-tarea').addEventListener('click', () => {
                    tareasReunion.splice(index, 1);
                    renderizarTareas();
                });
                tareasLista.appendChild(item);
            });
        }

        function generarPDF(reunion, tema, subpuntos) {
            const pdf = new jsPDF();
            let y = 15;
            
            pdf.setFontSize(14);
            pdf.setFont('georgia', 'bold');
            pdf.text('CONSTRUCTORA INGEURBE', 105, y, { align: 'center' });
            y += 8;
            
            pdf.setFontSize(11);
            pdf.setFont('georgia', 'italic');
            pdf.text('NOTAS PROFESIONAL DE CONSTRUCCIÓN', 105, y, { align: 'center' });
            y += 12;
            
            pdf.setDrawColor(150);
            pdf.line(20, y, 190, y);
            y += 10;
            
            pdf.setFontSize(11);
            pdf.setFont('georgia');
            pdf.text('REUNIÓN', 20, y);
            y += 6;
            pdf.setFontSize(16);
            pdf.setFont('georgia', 'bold');
            pdf.text(reunion, 20, y);
            y += 15;
            
            pdf.setFontSize(11);
            pdf.setFont('georgia');
            pdf.text('TEMA', 20, y);
            y += 6;
            pdf.setFontSize(14);
            pdf.setFont('georgia', 'bold');
            pdf.text(tema, 20, y);
            y += 15;
            
            pdf.setFontSize(11);
            pdf.setFont('georgia');
            pdf.text('SUBPUNTOS', 20, y);
            y += 10;
            
            subpuntos.forEach((item, index) => {
                if (y > 250) {
                    pdf.addPage();
                    y = 20;
                }
                pdf.setFontSize(11);
                pdf.setFont('georgia', 'bold');
                pdf.text(`${index + 1}. ${item.subpunto || '(sin título)'}`, 20, y);
                y += 8;
                
                pdf.setFontSize(10);
                pdf.text('Notas Asociadas:', 20, y);
                y += 6;
                
                pdf.setFontSize(10);
                const lines = pdf.splitTextToSize(item.notas || '(sin notas)', 170);
                pdf.text(lines, 20, y);
                y += (lines.length * 5) + 10;
            });

            if (tareasReunion.length > 0) {
                if (y > 240) {
                    pdf.addPage();
                    y = 20;
                }
                y += 5;
                pdf.setFontSize(11);
                pdf.setFont('georgia');
                pdf.text('TAREAS', 20, y);
                y += 8;
                
                pdf.setFontSize(10);
                tareasReunion.forEach((tarea, index) => {
                    if (y > 250) {
                        pdf.addPage();
                        y = 20;
                    }
                    pdf.text(`☐ ${index + 1}. ${tarea}`, 20, y);
                    y += 7;
                });
            }

            pdf.setFontSize(9);
            pdf.text(`Generado: ${new Date().toLocaleDateString('es-CO')} ${new Date().toLocaleTimeString('es-CO')}`, 105, 285, { align: 'center' });

            pdf.save(`${new Date().toLocaleDateString('es-CO').replace(/\//g, '-')}_${reunion.replace(/\s+/g, '_')}.pdf`);
        }

        btnGuardarNotas.addEventListener('click', async () => {
            const reunion = reunionInput.value.trim();
            const tema = temaInput.value.trim();
            const subpuntos = Array.from(document.querySelectorAll('.subpunto-item'))
                .map(item => ({
                    subpunto: item.querySelector('.subpunto-input').value.trim(),
                    notas: item.querySelector('.subpunto-notas').value.trim()
                }))
                .filter(item => item.subpunto || item.notas);

            if (!reunion || !tema || subpuntos.length === 0) {
                mostrarMensaje(mensajeNotas, 'Completa reunión, tema y al menos un subpunto', 'error');
                return;
            }

            btnGuardarNotas.disabled = true;
            btnGuardarNotas.textContent = 'GUARDANDO...';

            try {
                const hoy = new Date().toISOString().split('T')[0];
                await db.collection('notas').add({
                    reunion, tema, subpuntos, tareas: tareasReunion, fecha: hoy, timestamp: new Date().getTime()
                });
                generarPDF(reunion, tema, subpuntos);
                mostrarMensaje(mensajeNotas, '✓ Guardado y PDF descargado', 'success');
                reunionInput.value = temaInput.value = '';
                subpuntosContainer.innerHTML = '';
                tareasReunion = [];
                tareasNotasContainer.style.display = 'none';
                btnToggleTareas.textContent = '+ AGREGAR TAREAS';
                renderizarTareas();
            } catch (error) {
                mostrarMensaje(mensajeNotas, 'Error: ' + error.message, 'error');
            } finally {
                btnGuardarNotas.disabled = false;
                btnGuardarNotas.textContent = 'GUARDAR NOTAS';
            }
        });

        function mostrarMensaje(elem, texto, tipo) {
            elem.textContent = texto;
            elem.style.color = tipo === 'success' ? '#155724' : '#721c24';
            setTimeout(() => elem.textContent = '', 3000);
        }

        cargarTareas();
    </script>


</body></html>
