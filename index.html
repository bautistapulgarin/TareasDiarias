    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Georgia', serif; background: #fafaf8; color: #2a2a2a; }
        header { border-bottom: 1px solid #d0d0cc; padding: 20px 0; margin-bottom: 30px; }
        nav { display: flex; justify-content: space-between; max-width: 1400px; margin: 0 auto; padding: 0 40px; }
        .container { max-width: 1400px; margin: 0 auto; padding: 0 40px; }
        h1 { font-size: 2rem; text-align: center; margin-bottom: 30px; }
        .title-section { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .btn-icons { display: flex; gap: 12px; }
        .btn-add { width: 45px; height: 45px; border-radius: 50%; background: #3d3d38; color: #fafaf8; border: none; font-size: 22px; cursor: pointer; }
        .btn-add:hover { background: #2a2a2a; }
        .panels-container { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-bottom: 50px; }
        h2 { font-size: 1.3rem; margin-bottom: 20px; }
        .tareas-list { display: flex; flex-direction: column; gap: 15px; }
        .tarea-card { border: 1px solid #d0d0cc; padding: 18px; background: #fafaf8; }
        .tarea-title { font-weight: 600; font-size: 15px; }
        .tarea-proyecto { font-size: 11px; color: #999; }
        .tarea-info { font-size: 12px; color: #666; margin: 10px 0; }
        .btn-small { padding: 9px 15px; background: #5a7a8b; color: #fafaf8; border: none; cursor: pointer; border-radius: 20px; font-size: 10px; text-transform: uppercase; margin-right: 5px; }
        .btn-small:hover { background: #4a6a7b; }
        .btn-small.delete { background: #8b5a5a; }
        .btn-small.delete:hover { background: #6b4a4a; }
        .notas-form { border: 1px solid #d0d0cc; padding: 20px; background: #fafaf8; }
        .form-field { margin-bottom: 18px; }
        label { display: block; font-size: 11px; text-transform: uppercase; margin-bottom: 7px; color: #666; }
        input[type="text"], textarea, input[type="time"], input[type="range"] { width: 100%; padding: 11px 13px; border: 1px solid #d0d0cc; background: #fafaf8; font-family: 'Georgia', serif; font-size: 13px; color: #2a2a2a; }
        textarea { resize: vertical; min-height: 70px; }
        .btn-primary { width: 100%; padding: 12px; background: #3d3d38; color: #fafaf8; border: none; cursor: pointer; text-transform: uppercase; margin-top: 15px; font-family: 'Georgia', serif; }
        .btn-primary:hover { background: #2a2a2a; }
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); align-items: center; justify-content: center; }
        .modal.show { display: flex; }
        .modal-content { background: #fafaf8; padding: 30px; border: 1px solid #d0d0cc; width: 90%; max-width: 500px; position: relative; }
        .close { position: absolute; right: 20px; top: 20px; font-size: 28px; cursor: pointer; }
        .mensaje { font-size: 12px; margin-top: 10px; min-height: 20px; color: #721c24; }
        .success { color: #155724 !important; }
        #status { font-size: 10px; color: #999; }
        #status.connected { color: #155724; }
        footer { text-align: center; padding: 20px 0; color: #999; font-size: 11px; border-top: 1px solid #d0d0cc; margin-top: 50px; }
    </style>
</head>
<body>
    <header>
        <nav>
            <div>CONTROL DIARIO v1.6</div>
            <div><a href="https://bautistapulgarin.github.io/bitacora/">PROYECTOS</a></div>
            <div id="status" class="connected">✓ Conectado</div>
        </nav>
    </header>

    <div class="container">
        <div class="title-section">
            <h1>CONTROL DIARIO</h1>
            <div class="btn-icons">
                <button class="btn-add" id="btnNuevaTarea">+</button>
            </div>
        </div>

        <div class="panels-container">
            <div>
                <h2>Tareas del Día</h2>
                <div id="listaTareas" class="tareas-list"><div class="tarea-card">
                    <div class="tarea-title">Subtarea de prueba 1</div>
                    <div class="tarea-proyecto">TAREA DE PRUEBA 1</div>
                    <div class="tarea-info">08:20 - 09:02 | Prioridad: 8/10</div>
                    <button class="btn-small" onclick="iniciarTarea(&#39;j9DemIQEGf5HJowI0nUe&#39;)">INICIAR</button>
                    <button class="btn-small delete" onclick="eliminarTarea(&#39;j9DemIQEGf5HJowI0nUe&#39;)">ELIMINAR</button>
                </div></div>
            </div>

            <div>
                <h2>Toma de Notas</h2>
                <div class="notas-form">
                    <div class="form-field">
                        <label>Reunión</label>
                        <input type="text" id="reunionInput">
                    </div>
                    <div class="form-field">
                        <label>Tema</label>
                        <input type="text" id="temaInput">
                    </div>
                    <div class="form-field">
                        <label>Subpuntos</label>
                        <div id="subpuntosContainer"></div>
                        <button class="btn-primary" id="btnAddSubpunto" style="margin-top: 10px;">+ AGREGAR SUBPUNTO</button>
                    </div>
                    <button class="btn-primary" id="btnGuardarNotas">GUARDAR NOTAS</button>
                    <div class="mensaje" id="mensajeNotas"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Nueva Tarea -->
    <div id="modalNuevaTarea" class="modal">
        <div class="modal-content">
            <span class="close" id="closeModalTarea">×</span>
            <h3>Nueva Tarea</h3>
            <div class="form-field">
                <label>Proyecto</label>
                <input type="text" id="proyecto">
            </div>
            <div class="form-field">
                <label>Tarea</label>
                <input type="text" id="tarea">
            </div>
            <div class="form-field">
                <label>Hora inicial</label>
                <input type="time" id="horaInicial">
            </div>
            <div class="form-field">
                <label>Hora cierre</label>
                <input type="time" id="horaCierre">
            </div>
            <div class="form-field">
                <label>Prioridad: <span id="prioridadDisplay">5/10</span></label>
                <input type="range" id="prioridad" min="0" max="10" value="5">
            </div>
            <button class="btn-primary" id="guardarTarea">GUARDAR</button>
            <div class="mensaje" id="mensajeTarea"></div>
        </div>
    </div>

    <footer>
        <p>© 2025 Control Diario</p>
    </footer>

    <script>
        // Firebase config
        const firebaseConfig = {
            apiKey: "AIzaSyA-K-rjFQLD4ahPG1z5n9Pe_E4W2WfDD94",
            authDomain: "control-diario-1e2fb.firebaseapp.com",
            projectId: "control-diario-1e2fb",
            storageBucket: "control-diario-1e2fb.firebasestorage.app",
            messagingSenderId: "98274574789",
            appId: "1:98274574789:web:3c0970ef809754b9dc0bac"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const { jsPDF } = window.jspdf;

        document.getElementById('status').textContent = '✓ Conectado';
        document.getElementById('status').classList.add('connected');

        // DOM Elements
        const btnNuevaTarea = document.getElementById('btnNuevaTarea');
        const modalNuevaTarea = document.getElementById('modalNuevaTarea');
        const closeModalTarea = document.getElementById('closeModalTarea');
        const btnGuardarTarea = document.getElementById('guardarTarea');
        const inputProyecto = document.getElementById('proyecto');
        const inputTarea = document.getElementById('tarea');
        const inputHoraInicial = document.getElementById('horaInicial');
        const inputHoraCierre = document.getElementById('horaCierre');
        const inputPrioridad = document.getElementById('prioridad');
        const prioridadDisplay = document.getElementById('prioridadDisplay');
        const mensajeTarea = document.getElementById('mensajeTarea');
        const listaTareas = document.getElementById('listaTareas');
        const btnToggleTareas = document.getElementById('btnToggleTareas');
        const tareasNotasContainer = document.getElementById('tareasNotasContainer');
        const tareasLista = document.getElementById('tareasLista');
        const tareasInputContainer = document.getElementById('tareasInputContainer');
        const reunionInput = document.getElementById('reunionInput');
        const temaInput = document.getElementById('temaInput');
        const subpuntosContainer = document.getElementById('subpuntosContainer');
        const btnAddSubpunto = document.getElementById('btnAddSubpunto');
        const btnGuardarNotas = document.getElementById('btnGuardarNotas');
        const mensajeNotas = document.getElementById('mensajeNotas');

        let tareasReunion = [];
        let tareaInput = null;

        // EVENT LISTENERS
        btnNuevaTarea.addEventListener('click', function() {
            console.log('Click en Nueva Tarea');
            inputProyecto.value = '';
            inputTarea.value = '';
            inputHoraInicial.value = '';
            inputHoraCierre.value = '';
            inputPrioridad.value = '5';
            prioridadDisplay.textContent = '5/10';
            modalNuevaTarea.classList.add('show');
        });

        closeModalTarea.addEventListener('click', function() {
            modalNuevaTarea.classList.remove('show');
        });

        inputPrioridad.addEventListener('change', function() {
            prioridadDisplay.textContent = inputPrioridad.value + '/10';
        });

        btnGuardarTarea.addEventListener('click', async function() {
            console.log('Click en guardar tarea');
            const proyecto = inputProyecto.value.trim();
            const tarea = inputTarea.value.trim();
            const horaInit = inputHoraInicial.value;
            const horaCierr = inputHoraCierre.value;
            const prioridad = inputPrioridad.value;

            if (!proyecto || !tarea || !horaInit || !horaCierr) {
                mostrarMensaje(mensajeTarea, 'Completa todos los campos', 'error');
                return;
            }

            try {
                const hoy = new Date().toISOString().split('T')[0];
                await db.collection('tareas').add({
                    proyecto, tarea, horaInicial: horaInit, horaCierre: horaCierr,
                    prioridad: parseInt(prioridad), fecha: hoy, estado: 'pendiente'
                });
                mostrarMensaje(mensajeTarea, '✓ Guardado', 'success');
                modalNuevaTarea.classList.remove('show');
                cargarTareas();
            } catch (error) {
                mostrarMensaje(mensajeTarea, 'Error: ' + error.message, 'error');
            }
        });

        async function cargarTareas() {
            const hoy = new Date().toISOString().split('T')[0];
            const snapshot = await db.collection('tareas').where('fecha', '==', hoy).get();
            
            let tareas = [];
            snapshot.forEach(doc => tareas.push({ id: doc.id, data: doc.data() }));
            tareas.sort((a, b) => b.data.prioridad - a.data.prioridad);

            listaTareas.innerHTML = '';
            if (tareas.length === 0) {
                listaTareas.innerHTML = '<p style="color: #999;">Sin tareas</p>';
                return;
            }

            tareas.forEach(tarea => {
                const { proyecto, tarea: tareanombre, horaInicial, horaCierre, prioridad } = tarea.data;
                const card = document.createElement('div');
                card.className = 'tarea-card';
                card.innerHTML = `
                    <div class="tarea-title">${tareanombre}</div>
                    <div class="tarea-proyecto">${proyecto}</div>
                    <div class="tarea-info">${horaInicial} - ${horaCierre} | Prioridad: ${prioridad}/10</div>
                    <button class="btn-small" onclick="iniciarTarea('${tarea.id}')">INICIAR</button>
                    <button class="btn-small delete" onclick="eliminarTarea('${tarea.id}')">ELIMINAR</button>
                `;
                listaTareas.appendChild(card);
            });
        }

        window.iniciarTarea = async function(id) {
            const ahora = new Date().toLocaleTimeString('es-CO').slice(0, 5);
            await db.collection('tareas').doc(id).update({ estado: 'en_progreso', horaRealInicio: ahora });
            cargarTareas();
        };

        window.eliminarTarea = async function(id) {
            if (confirm('¿Eliminar?')) {
                await db.collection('tareas').doc(id).delete();
                cargarTareas();
            }
        };

        btnAddSubpunto.addEventListener('click', function() {
            console.log('Click en agregar subpunto');
            const item = document.createElement('div');
            item.style.cssText = 'border: 1px solid #e0e0dd; padding: 15px; background: #f8f8f6; margin-bottom: 15px;';
            item.innerHTML = `
                <input type="text" class="subpunto-input" placeholder="Subpunto" style="width: 100%; margin-bottom: 10px; padding: 10px; border: 1px solid #d0d0cc;">
                <textarea class="subpunto-notas" placeholder="Notas" style="width: 100%; padding: 10px; border: 1px solid #d0d0cc; min-height: 70px;"></textarea>
            `;
            subpuntosContainer.appendChild(item);
        });

        btnGuardarNotas.addEventListener('click', async function() {
            console.log('Click en guardar notas');
            const reunion = reunionInput.value.trim();
            const tema = temaInput.value.trim();
            const subpuntos = Array.from(document.querySelectorAll('.subpunto-input')).map((el, i) => ({
                subpunto: el.value.trim(),
                notas: document.querySelectorAll('.subpunto-notas')[i].value.trim()
            })).filter(s => s.subpunto || s.notas);

            if (!reunion || !tema || subpuntos.length === 0) {
                mostrarMensaje(mensajeNotas, 'Completa todos los campos', 'error');
                return;
            }

            try {
                const hoy = new Date().toISOString().split('T')[0];
                await db.collection('notas').add({
                    reunion, tema, subpuntos, tareas: tareasReunion, fecha: hoy
                });
                mostrarMensaje(mensajeNotas, '✓ Guardado', 'success');
                reunionInput.value = '';
                tema.value = '';
                subpuntosContainer.innerHTML = '';
                tareasReunion = [];
            } catch (error) {
                mostrarMensaje(mensajeNotas, 'Error: ' + error.message, 'error');
            }
        });

        function mostrarMensaje(elem, texto, tipo) {
            elem.textContent = texto;
            elem.className = 'mensaje ' + (tipo === 'success' ? 'success' : '');
            setTimeout(function() { elem.textContent = ''; }, 3000);
        }

        cargarTareas();
        console.log('Aplicación iniciada');
    </script>


</body></html>
