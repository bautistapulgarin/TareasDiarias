        .btn-add-subpunto, .btn-guardar-notas {

        .btn-add-subpunto:hover, .btn-guardar-notas:hover {

        .btn-toggle-tareas {

        .tareas-notas-container {

        .tarea-item {

        .btn-eliminar-tarea {

        }
        .btn-eliminar-tarea:hover {

        }
        .tareas-input-container {

<body>
    <header>
        <nav>
            <div class="nav-left">
                <span>CONTROL DIARIO</span>
                <span class="version">v1.0</span>
            </div>
            <div>
                <a href="file:///C:/Users/cpulgarin/Downloads/index_6.html#" style="opacity: 0.5;">CONTACTO</a>
            </div>
        </nav>
    </header>

    <div class="container">
        <div class="title-section">
            <h1>Control Diario</h1>
            <div class="btn-icons">
                <button class="btn-add" id="btnAddTarea" title="Agregar tarea">+</button>
                <button class="btn-notebook" id="btnNotebook" title="Notebook">📓</button>
            </div>
        </div>

        <div class="panels-container">
            <!-- Panel Izquierdo: Tareas -->
            <div>
                <h2>Tareas del Día</h2>
                <div class="tareas-list" id="tareasList"></div>
            </div>

            <!-- Panel Derecho: Notas -->
            <div>
                <h2>Notas de Reunión</h2>
                <div class="notas-form">
                    <div class="form-field">
                        <label>Reunión</label>
                        <input type="text" id="reunionInput" placeholder="Nombre de la reunión">
                    </div>
                    <div class="form-field">
                        <label>Tema</label>
                        <input type="text" id="temaInput" placeholder="Tema principal">
                    </div>
                </div>

                <button class="btn-toggle-tareas" id="btnToggleTareas">+ AGREGAR TAREAS</button>
                
                <div class="tareas-notas-container" id="tareasNotasContainer">
                    <div class="tareas-lista" id="tareasList2"></div>
                    <div class="tareas-input-container" id="tareasInputContainer"></div>
                </div>

                <div class="form-field">
                    <label>Subpuntos</label>
                    <div class="subpuntos-container" id="subpuntosContainer"><div class="subpunto-item">
                <input type="text" class="subpunto-input" placeholder="Subpunto">
                <textarea class="subpunto-notas" placeholder="Notas asociadas..."></textarea>
            </div></div>
                    <button class="btn-add-subpunto" id="btnAddSubpunto">+ AGREGAR SUBPUNTO</button>
                </div>

                <button class="btn-guardar-notas" id="btnGuardarNotas">GUARDAR NOTAS</button>
                <div class="mensaje-notas" id="mensajeNotas"></div>
            </div>
        </div>
    </div>

    <script type="module">
        // Firebase Imports
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, where, orderBy, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyA-K-rjFQLD4ahPG1z5n9Pe_E4W2WfDD94",
            authDomain: "control-diario-1e2fb.firebaseapp.com",
            projectId: "control-diario-1e2fb",
            storageBucket: "control-diario-1e2fb.firebasestorage.app",
            messagingSenderId: "98274574789",
            appId: "1:98274574789:web:3c0970ef809754b9dc0bac"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // DOM Elements
        const btnAddTarea = document.getElementById('btnAddTarea');
        const btnToggleTareas = document.getElementById('btnToggleTareas');
        const btnAddSubpunto = document.getElementById('btnAddSubpunto');
        const btnGuardarNotas = document.getElementById('btnGuardarNotas');
        const tareasList = document.getElementById('tareasList');
        const tareasList2 = document.getElementById('tareasList2');
        const tareasInputContainer = document.getElementById('tareasInputContainer');
        const tareasNotasContainer = document.getElementById('tareasNotasContainer');
        const reunionInput = document.getElementById('reunionInput');
        const temaInput = document.getElementById('temaInput');
        const subpuntosContainer = document.getElementById('subpuntosContainer');
        const mensajeNotas = document.getElementById('mensajeNotas');

        let tareasReunion = [];
        let tareaInput = null;
        let btnAddTareaInput = null;

        // Cargar tareas desde Firestore
        async function cargarTareas() {
            try {
                const hoy = new Date().toISOString().split('T')[0];
                const q = query(collection(db, 'tareas'), where('fecha', '==', hoy), orderBy('timestamp', 'desc'));
                const snapshot = await getDocs(q);
                tareasList.innerHTML = '';
                snapshot.forEach(doc => {
                    const tarea = doc.data();
                    const tarjetaHTML = `
                        <div class="tarea-card">
                            <div class="tarea-header">
                                <div>
                                    <div class="tarea-title">${tarea.titulo}</div>
                                    <div class="tarea-proyecto">${tarea.proyecto}</div>
                                </div>
                            </div>
                            <div class="tarea-info">Estimado: ${tarea.horasEstimadas}h</div>
                            <div style="display: flex; gap: 10px;">
                                <button class="btn-small iniciar" onclick="window.iniciarTarea('${doc.id}')">Iniciar</button>
                                <button class="btn-small terminar" onclick="window.terminarTarea('${doc.id}')">Terminar</button>
                            </div>
                        </div>
                    `;
                    tareasList.innerHTML += tarjetaHTML;
                });
            } catch (error) {
                console.error('Error cargando tareas:', error);
            }
        }

        window.iniciarTarea = async (id) => {
            alert('Tarea iniciada: ' + id);
        };

        window.terminarTarea = async (id) => {
            alert('Tarea terminada: ' + id);
        };

        btnAddTarea.addEventListener('click', async () => {
            const titulo = prompt('Nombre de la tarea:');
            if (!titulo) return;
            
            const proyecto = prompt('Proyecto:');
            const horasEstimadas = prompt('Horas estimadas:') || 1;

            try {
                const hoy = new Date().toISOString().split('T')[0];
                await addDoc(collection(db, 'tareas'), {
                    titulo,
                    proyecto,
                    horasEstimadas,
                    fecha: hoy,
                    timestamp: new Date().getTime()
                });
                cargarTareas();
            } catch (error) {
                alert('Error: ' + error.message);
            }
        });

        btnToggleTareas.addEventListener('click', () => {
            if (tareasNotasContainer.style.display === 'none') {
                tareasNotasContainer.style.display = 'block';
                btnToggleTareas.textContent = '- OCULTAR TAREAS';
                if (!tareaInput) {
                    crearInputTarea();
                }
            } else {
                tareasNotasContainer.style.display = 'none';
                btnToggleTareas.textContent = '+ AGREGAR TAREAS';
            }
        });

        function crearInputTarea() {
            tareasInputContainer.innerHTML = `
                <input type="text" id="tareaInput" placeholder="Nueva tarea" style="width: 100%; padding: 10px 12px; border: 1px solid #d0d0cc; background: #fafaf8; font-family: 'Georgia', serif; font-size: 13px; color: #2a2a2a; margin-top: 10px;">
                <button id="btnAddTarea2" style="width: 100%; padding: 10px; background: #5a7a8b; color: #fafaf8; border: none; font-family: 'Georgia', serif; font-size: 11px; letter-spacing: 0.5px; text-transform: uppercase; cursor: pointer; margin-top: 8px; border-radius: 20px;">+ AGREGAR TAREA</button>
            `;
            
            tareaInput = document.getElementById('tareaInput');
            btnAddTareaInput = document.getElementById('btnAddTarea2');
            
            btnAddTareaInput.addEventListener('click', () => {
                const tarea = tareaInput.value.trim();
                if (tarea) {
                    tareasReunion.push(tarea);
                    tareaInput.value = '';
                    renderizarTareas();
                }
            });
            
            tareaInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    const tarea = tareaInput.value.trim();
                    if (tarea) {
                        tareasReunion.push(tarea);
                        tareaInput.value = '';
                        renderizarTareas();
                    }
                }
            });
        }

        btnAddSubpunto.addEventListener('click', () => {
            const item = document.createElement('div');
            item.className = 'subpunto-item';
            item.innerHTML = `
                <input type="text" class="subpunto-input" placeholder="Subpunto">
                <textarea class="subpunto-notas" placeholder="Notas asociadas..."></textarea>
            `;
            subpuntosContainer.appendChild(item);
        });

        function renderizarTareas() {
            tareasList2.innerHTML = '';
            tareasReunion.forEach((tarea, index) => {
                const item = document.createElement('div');
                item.className = 'tarea-item';
                item.innerHTML = `<span>${index + 1}. ${tarea}</span><button class="btn-eliminar-tarea">✕</button>`;
                item.querySelector('.btn-eliminar-tarea').addEventListener('click', () => {
                    tareasReunion.splice(index, 1);
                    renderizarTareas();
                });
                tareasList2.appendChild(item);
            });
        }

        function generarPDF(reunion, tema, subpuntos) {
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF();
            let y = 15;
            
            pdf.setFont('georgia');
            pdf.setFontSize(14);
            pdf.setFont('georgia', 'bold');
            pdf.setTextColor(0);
            pdf.text('CONSTRUCTORA INGEURBE', 105, y, { align: 'center' });
            y += 8;
            
            pdf.setFontSize(11);
            pdf.setFont('georgia', 'italic');
            pdf.setTextColor(80);
            pdf.text('NOTAS PROFESIONAL DE CONSTRUCCIÓN', 105, y, { align: 'center' });
            y += 12;
            
            pdf.setDrawColor(150);
            pdf.line(20, y, 190, y);
            y += 10;
            
            pdf.setFontSize(11);
            pdf.setFont('georgia');
            pdf.setTextColor(100);
            pdf.text('REUNIÓN', 20, y);
            y += 6;
            pdf.setFontSize(16);
            pdf.setFont('georgia', 'bold');
            pdf.setTextColor(0);
            pdf.text(reunion, 20, y);
            y += 15;
            
            pdf.setFontSize(11);
            pdf.setFont('georgia');
            pdf.setTextColor(100);
            pdf.text('TEMA', 20, y);
            y += 6;
            pdf.setFontSize(14);
            pdf.setFont('georgia', 'bold');
            pdf.setTextColor(0);
            pdf.text(tema, 20, y);
            y += 15;
            
            pdf.setFontSize(11);
            pdf.setFont('georgia');
            pdf.setTextColor(100);
            pdf.text('SUBPUNTOS', 20, y);
            y += 10;
            
            subpuntos.forEach((item, index) => {
                if (y > 250) {
                    pdf.addPage();
                    y = 20;
                }
                pdf.setFontSize(11);
                pdf.setFont('georgia', 'bold');
                pdf.setTextColor(0);
                pdf.text(`${index + 1}. ${item.subpunto || '(sin título)'}`, 20, y);
                y += 8;
                
                pdf.setFontSize(10);
                pdf.setTextColor(100);
                pdf.setFont('georgia');
                pdf.text('Notas Asociadas:', 20, y);
                y += 6;
                
                pdf.setFontSize(10);
                pdf.setTextColor(0);
                const lines = pdf.splitTextToSize(item.notas || '(sin notas)', 170);
                pdf.text(lines, 20, y);
                y += (lines.length * 5) + 10;
            });

            if (tareasReunion.length > 0) {
                if (y > 240) {
                    pdf.addPage();
                    y = 20;
                }
                y += 5;
                pdf.setFontSize(11);
                pdf.setFont('georgia');
                pdf.setTextColor(100);
                pdf.text('TAREAS', 20, y);
                y += 8;
                
                pdf.setFontSize(10);
                pdf.setTextColor(0);
                tareasReunion.forEach((tarea, index) => {
                    if (y > 250) {
                        pdf.addPage();
                        y = 20;
                    }
                    pdf.text(`☐ ${index + 1}. ${tarea}`, 20, y);
                    y += 7;
                });
            }

            pdf.setFontSize(9);
            pdf.setTextColor(150);
            pdf.text(`Generado: ${new Date().toLocaleDateString('es-CO')} ${new Date().toLocaleTimeString('es-CO')}`, 105, 285, { align: 'center' });

            pdf.save(`${new Date().toLocaleDateString('es-CO').replace(/\//g, '-')}_${reunion.replace(/\s+/g, '_')}.pdf`);
        }

        btnGuardarNotas.addEventListener('click', async () => {
            const reunion = reunionInput.value.trim();
            const tema = temaInput.value.trim();
            const subpuntos = Array.from(document.querySelectorAll('.subpunto-item'))
                .map(item => ({
                    subpunto: item.querySelector('.subpunto-input').value.trim(),
                    notas: item.querySelector('.subpunto-notas').value.trim()
                }))
                .filter(item => item.subpunto || item.notas);

            if (!reunion || !tema || subpuntos.length === 0) {
                mostrarMensaje(mensajeNotas, 'Completa reunión, tema y al menos un subpunto', 'error');
                return;
            }

            btnGuardarNotas.disabled = true;
            btnGuardarNotas.textContent = 'GUARDANDO...';

            try {
                const hoy = new Date().toISOString().split('T')[0];
                await addDoc(collection(db, 'notas'), {
                    reunion, tema, subpuntos, tareas: tareasReunion, fecha: hoy, timestamp: new Date().getTime()
                });
                generarPDF(reunion, tema, subpuntos);
                mostrarMensaje(mensajeNotas, '✓ Guardado y PDF descargado', 'success');
                reunionInput.value = temaInput.value = '';
                subpuntosContainer.innerHTML = '';
                tareasReunion = [];
                tareasNotasContainer.style.display = 'none';
                btnToggleTareas.textContent = '+ AGREGAR TAREAS';
                renderizarTareas();
            } catch (error) {
                mostrarMensaje(mensajeNotas, 'Error: ' + error.message, 'error');
            } finally {
                btnGuardarNotas.disabled = false;
                btnGuardarNotas.textContent = 'GUARDAR NOTAS';
            }
        });

        function mostrarMensaje(elem, texto, tipo) {
            elem.textContent = texto;
            elem.style.color = tipo === 'success' ? '#155724' : '#721c24';
            setTimeout(() => elem.textContent = '', 3000);
        }

        cargarTareas();
    </script>
